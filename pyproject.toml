[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nutrition-assistant"
version = "0.1.0"
description = "Prototype nutrition calculation and meal planning tools"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "pandas",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["src"]
